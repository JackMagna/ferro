# Test automatici sull'app Android (e2e-android/) in un emulatore Android sui server di GitHub (Linux con KVM),
# con gli emulatori Firebase (Auth + Firestore, progetto finto demo-ferro) e l'accesso Google finto dell'APK di prova.
# Nessun account vero, nessun segreto. Si avvia a mano (Actions → Test Android → Run workflow)
# oppure con un push sul ramo android-test.
name: Test Android

on:
  workflow_dispatch:
  push:
    branches: ['android-test']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # il disco del server è piccolo per un emulatore: si tolgono strumenti preinstallati che qui non servono
      - name: Spazio su disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dipendenze
        run: |
          bun install --frozen-lockfile
          npm install -g firebase-tools

      - name: APK di prova (it.irontrack.app.test, collegato agli emulatori Firebase)
        run: node scripts/android-e2e-build.mjs

      - name: Accelerazione per l'emulatore (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test sull'emulatore Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: npx playwright test -c playwright.android.config.ts

      - name: Rapporto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapporto-test-android
          path: |
            e2e-report-android/
            e2e-results-android/
