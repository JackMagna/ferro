<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ferro</title>
    <meta name="description" content="Scheda di allenamento in palestra: serie, carichi, recuperi e progressi. Funziona anche offline." />
    <meta name="theme-color" content="#1a1c1f" />
    <script>
      // Applica il tema salvato prima del primo disegno, così la pagina non lampeggia. Deve restare in sintonia con src/lib/theme.ts.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('irontrack:theme') || '{}');
          var old = { attuale: 'classico', nothing: 'grafite', ibrido: 'brace' };
          var t = old[p.theme] || p.theme;
          t = ['classico', 'grafite', 'brace'].indexOf(t) >= 0 ? t : 'classico';
          var m = p.mode === 'dark' || p.mode === 'light' ? p.mode : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var bar = { classico: ['#1a1c1f', '#f3f0e8'], grafite: ['#000000', '#ffffff'], brace: ['#0e0e10', '#f1f0ec'] };
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-mode', m);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bar[t][m === 'dark' ? 0 : 1]);
          var v = t === 'grafite' ? 'grafite-' + m : t;
          document.querySelector('link[rel="icon"]').setAttribute('href', 'icons/ferro-' + v + '.svg');
          document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href', 'icons/ferro-' + v + '-180.png');
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ferro" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
