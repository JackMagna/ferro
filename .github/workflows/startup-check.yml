# Prova di avvio degli APK pubblicati sull'emulatore Android (aggiornamento da una versione all'altra), con logcat.
name: Prova avvio
on:
  workflow_dispatch:
  push:
    branches: ['claude/project-thread-zvci91']
    paths: ['.github/workflows/startup-check.yml', 'scripts/startup-check.sh']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: APK delle release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p apk
          for v in v2.5.2 v2.6.0 v2.6.1; do gh release download $v -R ${{ github.repository }} -p ferro-release.apk -O apk/$v.apk; done
          ls -la apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/startup-check.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: prova-avvio, path: startup-check/ }
