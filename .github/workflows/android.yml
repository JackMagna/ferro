# Costruisce l'app Android di Ferro (Capacitor) da questo stesso codice.
# - A mano: Actions → Android → Run workflow (scarichi l'APK dagli Artifacts).
# - Da Actions → Android → Run workflow con «versione» (es. v2.7.0): crea il tag su questo commit e la Release, come un tag v*.
# - Con un tag v* (es. v2.3.0): crea la Release con ferro-release.apk. Il sito e l'avviso di aggiornamento nell'app
#   usano sempre l'ultima Release (releases/latest), quindi la chiave di firma deve restare la stessa.
# Segreti (Settings → Secrets and variables → Actions), facoltativi: senza, l'APK è firmato con la chiave di debug.
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Segreto obbligatorio: FIREBASE_API_KEY = chiave API web di Firebase (non sta più nel repository).
# Variabile (non segreta): GOOGLE_WEB_CLIENT_ID = ID client OAuth «Applicazione web», per l'accesso Google nell'app.
name: Android

on:
  workflow_dispatch:
    inputs:
      versione:
        description: 'Versione da pubblicare (es. v2.7.0): crea tag e Release. Vuoto = solo APK negli Artifacts'
        required: false
        default: ''
  push:
    tags: ['v*']
    # un push sul ramo android-build costruisce l'APK senza creare una Release (utile per le prove)
    branches: ['android-build']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # i segreti non si possono usare direttamente negli "if": si passa da una variabile
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # versione vera: dal tag v* o dal campo «versione» del lancio a mano; vuota per le prove
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.versione || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Controlla la versione
        if: env.TAG != ''
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Versione non valida: $TAG (serve vX.Y.Z)"; exit 1; }
          [ "v$(node -p "require('./package.json').version")" = "$TAG" ] || { echo "::error::$TAG diversa da package.json"; exit 1; }

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dipendenze
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run build
        env:
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          # solo le versioni vere (tag v*) controllano gli aggiornamenti all'apertura (src/lib/appUpdate.ts)
          VITE_APP_VERSION: ${{ env.TAG }}
          # nell'app Android l'app sta alla radice (sul sito è in /app/)
          APP_BASE: /

      - name: Progetto Android
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.TAG != '' && env.TAG || format('build-{0}', github.run_number) }}
          ANDROID_KEYSTORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', github.workspace) || '' }}

      - name: Chiave di firma
        if: env.HAS_KEYSTORE == 'true'
        # tr toglie a capo, spazi e BOM che PowerShell può aggiungere al segreto; keytool ferma subito una chiave sbagliata
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          # dimensione e inizio dell'impronta del file: si confrontano con la chiave originale senza svelarla
          echo "keystore: $(wc -c < "$GITHUB_WORKSPACE/release.jks") byte, sha256 $(sha256sum "$GITHUB_WORKSPACE/release.jks" | cut -c1-16)"
          keytool -list -keystore "$GITHUB_WORKSPACE/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -v 2>&1 | grep -E "SHA1:|keytool error" || true
          echo "alias nel keystore: $(keytool -list -keystore "$GITHUB_WORKSPACE/release.jks" -storepass "$KEYSTORE_PASSWORD" 2>&1 | grep -i "entry" | cut -d, -f1 | tr '\n' ' ') (segreto: ${#KEY_ALIAS} caratteri)"
          keytool -list -keystore "$GITHUB_WORKSPACE/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1 || { echo "::error::Chiave o password del keystore non valide: ricontrolla i segreti ANDROID_KEYSTORE_*"; exit 1; }
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Compila APK (firmato)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Il file per Google Play (AAB) non può aggiornarsi da solo: si toglie REQUEST_INSTALL_PACKAGES prima di compilarlo
      - name: Compila AAB per Google Play (firmato)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          node scripts/patch-android.mjs --play
          cd android && ./gradlew --no-daemon bundleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Compila (debug, senza chiave)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Raccogli i file
        run: |
          mkdir -p out
          find android/app/build/outputs -name '*.apk' -exec cp {} out/ \;
          find android/app/build/outputs -name '*.aab' -exec cp {} out/ \; || true
          cd out && for f in *.apk; do mv "$f" "ferro-${f#app-}"; done; ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ferro-android
          path: out/

      - name: Release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Ferro ${{ env.TAG }}
          files: out/*
          # novità della versione (le legge anche il banner di aggiornamento nell'app): rilascio/vX.Y.Z.md, se c'è
          body_path: ${{ hashFiles(format('rilascio/{0}.md', env.TAG)) != '' && format('rilascio/{0}.md', env.TAG) || '' }}

      # Il ramo android-build pubblica anche una versione di prova scaricabile con un link diretto
      - name: Versione di prova
        if: github.ref == 'refs/heads/android-build'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prova-${{ github.run_number }}
          name: Ferro, versione di prova ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: Versione di prova per Android, non firmata con la chiave definitiva se mancano i segreti. Installala solo se sai da dove arriva.
          files: out/*.apk
